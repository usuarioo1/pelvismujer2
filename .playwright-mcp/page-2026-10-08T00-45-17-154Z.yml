        - heading "Habitar tu cuerpo es volver a casa" [level=2] [ref=f30e81]
        - generic [ref=f30e83]:
          - paragraph [ref=f30e84]: Soy Daniela Flores, Kinesióloga y fundadora de PelvisMujer.
          - paragraph [ref=f30e85]: "Este espacio nace de una certeza: el cuerpo guarda una sabiduría que muchas veces olvidamos escuchar. Mi camino comenzó en la búsqueda —en mis ciclos, mis dolores y mis emociones— hasta que una crisis abrió un portal. Ahí entendí que acompañar no es solo tratar: es sostener procesos profundos de reconexión."
          - paragraph [ref=f30e86]: "Así nace PelvisMujer: una integración viva donde el cuerpo deja de ser algo que corregir y se transforma en un territorio que habitar, honrar y despertar. Aquí, tu pelvis no es solo anatomía: es raíz, centro y guía."
          - paragraph [ref=f30e87]: Acompaño a mujeres en cada etapa —ciclicidad, gestación, parto, posparto y climaterio— a volver a sí mismas, con presencia, sensibilidad y verdad.
        - list [ref=f30e89]:
          - listitem [ref=f30e90]: Kinesiología de piso pélvico
          - listitem [ref=f30e91]: Yoga
          - listitem [ref=f30e92]: Terapia Gestalt
          - listitem [ref=f30e93]: Neurociencia
    - generic [ref=f30e95]:
      - generic [ref=f30e96]:
        - heading "¿Por qué elegir PelvisMujer?" [level=2] [ref=f30e98]
        - paragraph [ref=f30e100]: “Acá no tratamos cuerpos como máquinas. Escuchamos historias.”
        - generic [ref=f30e102]:
          - paragraph [ref=f30e103]: "No buscamos corregirte ni decirte cómo debería funcionar tu cuerpo. Acompañamos tu proceso de rehabilitación desde la escucha, el movimiento y la conciencia corporal: te invitamos a volver a tu centro, a comprender lo que ocurre en tu cuerpo y a recuperar la confianza en él."
          - paragraph [ref=f30e104]: "Porque rehabilitar no es simplemente corregir una función: es volver a sentirte, reconocerte y habitarte. PelvisMujer es un espacio para habitar tu cuerpo."
        - generic [ref=f30e106]:
