            - paragraph [ref=e111]: Acompañamiento individual de Kinesiología y preparación al parto para vivir tu gestación con calma, conexión y confianza. A través de movimiento, respiración, manejo del dolor y preparación del piso pélvico, te guiamos hacia un parto seguro, presente y empoderado. Presencial u online, reembolsable.
        - generic [ref=e112]:
          - img "Taller de preparación al parto" [ref=e114]
          - generic [ref=e115]:
            - 'heading "Taller de preparación al parto: \"Pelvis libre y parto respetado\"" [level=3] [ref=e116]'
            - paragraph [ref=e117]: Taller personalizado donde aprenderás movimientos, respiración, vocalización y técnicas de manejo del dolor para un parto fluido y consciente. Integra Kinesiología, yoga y neurociencia para soltar miedos, aliviar tensiones y fortalecer tu confianza. Puedes asistir con tu acompañante. Reembolsable
        - generic [ref=e118]:
          - img "Membresía Raíz cíclica" [ref=e120]
          - generic [ref=e121]:
            - heading "Membresía Raíz cíclica" [level=3] [ref=e122]
            - paragraph [ref=e123]: Espacio online de autocuidado femenino para habitar tu cuerpo en todas tus etapas. Combina Kinesiología de piso pélvico, yoga, meditación y Gestalt para acompañarte en menstruación, gestación, posparto y climaterio. Un círculo íntimo para volver a tu raíz y nutrir tu bienestar cíclico.
    - generic [ref=e125]:
