      - generic [ref=e68]:
        - heading "Habitar tu cuerpo es volver a casa" [level=2] [ref=e69]
        - paragraph [ref=e70]: "Soy Daniela Flores, Kinesióloga y fundadora de PelvisMujer.Este espacio nace de una certeza: el cuerpo guarda una sabiduría que muchas veces olvidamos escuchar.Mi camino comenzó en la búsqueda, en mis ciclos, mis dolores y mis emociones, hasta que una crisis abrió un portal. Ahí entendí que acompañar no es solo tratar, es sostener procesos profundos de reconexión.Así nace PelvisMujer: una integración viva de Kinesiología de piso pélvico, yoga, meditación, terapia Gestalt y conciencia corporal. Un espacio donde el cuerpo deja de ser algo que corregir y se transforma en un territorio que habitar, honrar y despertar.Aquí, tu pelvis no es solo anatomía: es raíz, centro y guía.Es el lugar desde donde puedes sanar, ordenar y reconectar con tu poder.Acompaño a mujeres en cada etapa: ciclicidad, gestación, parto, posparto y climaterio, a volver a sí mismas, con presencia, sensibilidad y verdad."
    - generic [ref=e72]:
      - generic [ref=e73]:
        - generic [ref=e74]: ¿Por qué elegir PelvisMujer?
        - paragraph [ref=e87]: Acá no tratamos cuerpos como máquinas. Escuchamos historias. No buscamos corregirte ni decirte cómo debería funcionar tu cuerpo. Acompañamos tu proceso de rehabilitación desde la escucha, el movimiento y la conciencia corporal. No intervenimos desde afuera. Te invitamos a volver a tu centro, a comprender lo que ocurre en tu cuerpo y a recuperar la confianza en él. Porque rehabilitar no es simplemente corregir una función. Es volver a sentirte, reconocerte y habitarte. PelvisMujer es un espacio para habitar tu cuerpo.
        - generic [ref=e88]:
