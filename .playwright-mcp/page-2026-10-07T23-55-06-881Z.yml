        - generic [ref=e95]:
          - heading "Acompañamiento consciente en todas las etapas de la vida femenina" [level=3] [ref=e96]
          - paragraph [ref=e97]: "No solo tratamos síntomas: te acompañamos en tus ciclos, gestación, parto, posparto y madurez, honrando tu historia y tu proceso."
        - generic [ref=e98]:
